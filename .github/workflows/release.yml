name: Build and Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    name: Check, build, release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 版本号是手工点名的：本地跑 version-bump、提交，再把同名 tag 推上来。
      # tag 与 manifest.json 不一致就停下来 —— 没有别的地方会核这件事。
      - name: Verify tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version)")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "tag $TAG does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
